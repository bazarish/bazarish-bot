# Bazarish project (c) 2026
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deb:
    name: Debian 13 ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    container: debian:trixie
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    env:
      BAZARISH_JOBS: 4
    steps:
      - name: Install the toolchain and the dependencies
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends \
            build-essential cmake ninja-build git ca-certificates pkg-config python3 file \
            libssl-dev zlib1g-dev libboost-dev libboost-program-options-dev \
            libsqlcipher-dev libqrencode-dev libopus-dev libicu-dev dpkg-dev
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Build, test and pack
        run: |
          git config --global --add safe.directory '*'
          bash packaging/deb/build.sh out
      - uses: actions/upload-artifact@v4
        with:
          name: deb-${{ matrix.arch }}
          path: out/*.deb
      - name: Publish in the release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.deb
