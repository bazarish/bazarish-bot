<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Sign in - bazarish bot</title>
<link rel="icon" href="/assets/favicon.svg">
<link rel="stylesheet" href="/assets/style.css">
</head>
<body class="centred">
<main class="sheet">
  <img class="wordmark" src="/assets/logo.svg" alt="bazarish" width="404" height="76">
  <p class="sheet-note">Bot panel</p>

  <section class="panel-box" id="setup" hidden>
    <p class="view-title">Set a password</p>
    <p class="step-note">This daemon has not been set up yet. The password you set
    here opens everything else: the account, its conversations, and the tokens
    that open the API. Nothing is served until it is set.</p>
    <label class="field-label" for="newPassword">Password</label>
    <input class="field" type="password" id="newPassword" autocomplete="new-password" autofocus>
    <p class="form-footer"><button class="btn" id="setPassword" type="button">Set password</button></p>
    <p class="hint" id="setupError"></p>
  </section>

  <section class="panel-box" id="signin" hidden>
    <p class="view-title">Sign in</p>
    <label class="field-label" for="password">Password</label>
    <input class="field" type="password" id="password" autocomplete="current-password" autofocus>
    <p class="form-footer"><button class="btn" id="signIn" type="button">Sign in</button></p>
    <p class="hint" id="signinError"></p>
  </section>
</main>
<script src="/assets/login.js" defer></script>
</body>
</html>
