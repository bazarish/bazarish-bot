<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title data-t="Sign in - bazarish bot">Sign in - bazarish bot</title>
<link rel="icon" href="/assets/favicon.svg">
<link rel="stylesheet" href="/assets/style.css">
</head>
<body class="centred">
<div class="corner" id="languageSlot"></div>
<main class="sheet">
  <div class="brand"><img class="wordmark" src="/assets/logo.svg" alt="bazarish" width="404" height="76"><svg class="bot-mark" viewBox="0 0 28 28" aria-hidden="true"><path d="M14 5V2.5"/><circle cx="14" cy="1.8" r="0.9"/><rect x="5" y="5" width="18" height="15" rx="4"/><circle class="bot-eye" cx="10.2" cy="11.6" r="2.1"/><circle class="bot-eye is-red" cx="17.8" cy="11.6" r="2.1"/><path d="M10 16.4h8M12.7 16.4v-1.1M15.3 16.4v-1.1"/><path d="M2.6 10.2v4.6M25.4 10.2v4.6"/><path d="M10.5 20v3.2h7V20"/></svg></div>
  <p class="sheet-note" data-t="Bot panel">Bot panel</p>

  <section class="panel-box">
    <p class="view-title" id="title">Sign in</p>
    <p class="step-note" id="unclaimed" hidden data-t="This host has no administrator. The key that signs this challenge becomes the administrator. Until then, anyone who opens this page can claim the host.">This host has no administrator. The key that signs this challenge becomes the administrator. Until then, anyone who opens this page can claim the host.</p>
    <p class="step-note" data-t="Sign this challenge with your Bazarish account key and paste the signature.">Sign this challenge with your Bazarish account key and paste the signature.</p>
    <p class="field-label" data-t="Challenge">Challenge</p>
    <pre class="copy" id="challenge"></pre>
    <label class="field-label" for="blob" data-t="Signature">Signature</label>
    <textarea class="field field-tall" id="blob" autofocus></textarea>
    <p class="form-footer"><button class="btn" id="signIn" type="button">Sign in</button></p>
    <p class="hint" id="signinError"></p>
  </section>
</main>
<script src="/assets/messages.js" defer></script>
<script src="/assets/i18n.js" defer></script>
<script src="/assets/copy.js" defer></script>
<script src="/assets/login.js" defer></script>
</body>
</html>
