<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Sign in - bazarish bot</title>
<link rel="icon" href="/assets/favicon.svg">
<link rel="stylesheet" href="/assets/style.css">
</head>
<body class="centred">
<main class="sheet">
  <img class="wordmark" src="/assets/logo.svg" alt="bazarish" width="404" height="76">
  <p class="sheet-note">Bot panel</p>

  <section class="panel-box">
    <p class="view-title" id="title">Sign in</p>
    <p class="step-note" id="unclaimed" hidden>This host has no operator yet. The key that
    signs this challenge becomes its operator and is written into its config; until then
    anyone who reaches this page can claim it.</p>
    <p class="step-note">Sign this challenge in Bazarish under Signature and paste the result
    back.</p>
    <p class="field-label">Challenge</p>
    <pre class="copy" id="challenge"></pre>
    <label class="field-label" for="blob">Signature</label>
    <textarea class="field field-tall" id="blob" autofocus></textarea>
    <p class="form-footer"><button class="btn" id="signIn" type="button">Sign in</button></p>
    <p class="hint" id="signinError"></p>
  </section>
</main>
<script src="/assets/copy.js" defer></script>
<script src="/assets/login.js" defer></script>
</body>
</html>
